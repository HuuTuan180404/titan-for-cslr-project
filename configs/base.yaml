# ============================================================
# BASE CONFIGURATION
# ============================================================

# ------------------------------------------------------------
# 1. PROJECT
# ------------------------------------------------------------
project:
  name: continuous_sign_language_recognition
  seed: 42


# ------------------------------------------------------------
# 2. DATASET
# ------------------------------------------------------------
dataset:
  benchmark: null
  root: ./data
  metadata_root: ./metadata

  use_rgb: false

  max_length: 256

  phase:
    train: train
    dev: dev
    test: test

# ------------------------------------------------------------
# 3. POSE
# ------------------------------------------------------------
pose:
  format: npy

  left_hand:
    enabled: true
    num_joints: 21
    channels: 2

  right_hand:
    enabled: true
    num_joints: 21
    channels: 2

  face:
    enabled: false
    num_joints: 19
    channels: 2

  body:
    enabled: false
    num_joints: 25
    channels: 2

  normalize: false
  transform: false
  augmentation: false


rgb:
  image_size: 112
  format: jpg

  left_hand:
    enabled: true
    channels: 3

  right_hand:
    enabled: true
    channels: 3

  normalize: false
  transform: false
  augmentation: false

# ------------------------------------------------------------
# 5. DATALOADER
# ------------------------------------------------------------
dataloader:
  batch_size: 16
  num_workers: 4

  shuffle: true

  pin_memory: true
  drop_last: false

  persistent_workers: true


# ------------------------------------------------------------
# 7. MODEL
# ------------------------------------------------------------
model:
  name: null

  num_classes: null

  pose_encoder:
    enabled: true

  rgb_encoder:
    enabled: true

  fusion:
    type: cross_attention



# ============================================================
# Optimizer
# ============================================================

optimizer:
  name: "adamw"

  learning_rate: 0.0001

  weight_decay: 0.0001

  betas: [0.9, 0.999]

  eps: 1.0e-8


# ============================================================
# Scheduler
# ============================================================

scheduler:
  name: "cosine"

  min_lr: 1.0e-6

  warmup_epochs: 5



# ============================================================
# Validation
# ============================================================

validation:
  enabled: true

  interval: 1

  metric: "top1"

  mode: "max"


# ============================================================
# Early Stopping
# ============================================================

early_stopping:
  enabled: true

  patience: 10

  metric: "val_top1"

  mode: "max"



# ============================================================
# Logging
# ============================================================

logging:
  log_dir: "./logs"

  experiment_name: "ishara500_siformer"

  tensorboard: true

  print_interval: 10


# ------------------------------------------------------------
# 8. TEMPORAL ENCODER
# ------------------------------------------------------------
temporal:
  encoder: transformer

  d_model: 512
  num_layers: 4
  num_heads: 8

  dim_feedforward: 2048

  dropout: 0.1

  activation: gelu


# ------------------------------------------------------------
# 9. CLASSIFIER
# ------------------------------------------------------------
classifier:
  type: ctc
  dropout: 0.1


# ------------------------------------------------------------
# 10. TRAINING
# ------------------------------------------------------------
training:
  epochs: 100

  optimizer:
    name: adamw
    lr: 0.0001
    weight_decay: 0.01

  scheduler:
    name: cosine
    warmup_epochs: 5

  gradient_clip:
    enabled: true
    max_norm: 5.0

  mixed_precision:
    enabled: true

  accumulation_steps: 1


# ------------------------------------------------------------
# 11. LOSS
# ------------------------------------------------------------
loss:
  type: ctc

  ctc:
    blank: 0
    zero_infinity: true


# ------------------------------------------------------------
# 12. CHECKPOINT
# ------------------------------------------------------------
checkpoint:
  save_dir: ./checkpoints

  save_best: true

  monitor: val_wer
  mode: min

  save_last: true



# ------------------------------------------------------------
# 14. DEVICE
# ------------------------------------------------------------
device:
  accelerator: cuda
  gpu_ids: [0]

  deterministic: false